server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600
      # Supprime les doublons de headers CORS que les services backend ajoutent aussi
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

      routes:
        # ── Auth Service ──────────────────────────────────────────────────────
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
          filters:
            - JwtAuth

        # ── Job Service ───────────────────────────────────────────────────────
        - id: job-service-offers
          uri: lb://job-service
          predicates:
            - Path=/api/offers/**
          filters:
            - JwtAuth

        - id: job-service-applications
          uri: lb://job-service
          predicates:
            - Path=/api/applications/**
          filters:
            - JwtAuth

        - id: job-service-favorites
          uri: lb://job-service
          predicates:
            - Path=/api/favorites/**
          filters:
            - JwtAuth

        - id: job-service-notifications
          uri: lb://job-service
          predicates:
            - Path=/api/notifications/**
          filters:
            - JwtAuth

        # ── User Service ──────────────────────────────────────────────────────
        - id: user-service-profile
          uri: lb://user-service
          predicates:
            - Path=/api/profile/**
          filters:
            - JwtAuth

        - id: user-service-portfolio
          uri: lb://user-service
          predicates:
            - Path=/api/portfolio/**
          filters:
            - JwtAuth

        - id: user-service-settings
          uri: lb://user-service
          predicates:
            - Path=/api/settings/**
          filters:
            - JwtAuth

        - id: user-service-wallet
          uri: lb://user-service
          predicates:
            - Path=/api/wallet/**
          filters:
            - JwtAuth

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

app:
  jwt:
    secret: ${JWT_SECRET}
