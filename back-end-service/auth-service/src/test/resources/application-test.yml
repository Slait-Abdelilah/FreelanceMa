spring:
  datasource:
    url: jdbc:h2:mem:auth_test_db;MODE=MariaDB;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  cloud:
    discovery:
      enabled: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false

eureka:
  client:
    enabled: false

app:
  jwt:
    secret: test-jwt-secret-with-at-least-thirty-two-characters
  frontend-url: http://localhost:5173

mail:
  username: test@example.com
  password: test
