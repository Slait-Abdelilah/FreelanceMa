server:
  port: 8083

spring:
  application:
    name: jobservice

  datasource:
    url: jdbc:mariadb://localhost:3306/freelance_job_db
    username: root
    password:
    driver-class-name: org.mariadb.jdbc.Driver


  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect

# URL de auth-service pour valider le JWT
auth-service:
  url: http://localhost:8081

# JWT (meme secret que auth-service !)
app:
  jwt:
    secret: "${JWT_SECRET}"

logging:
  level:
    org.example.jobservice.security: DEBUG

